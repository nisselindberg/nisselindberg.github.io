<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nisse Lindberg</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
      .site-footer {
        background: #222;
        color: #fff;
        padding: 40px 0;
      }
      .site-footer a {
        color: #fff;
        text-decoration: none;
      }
      .social-profiles ul {
        list-style: none;
        padding: 0;
        display: flex;
        gap: 10px;
      }
      .social-profiles li a {
        display: block;
        width: 30px;
        height: 30px;
        background: #555;
        border-radius: 50%;
        text-align: center;
        line-height: 30px;
        color: white;
      }
      .back-to-top {
        position: fixed;
        bottom: 20px;
        right: 20px;
      }
      .back-to-top a {
        display: block;
        width: 40px;
        height: 40px;
        background: #222;
        color: #fff;
        text-align: center;
        line-height: 40px;
        border-radius: 50%;
        text-decoration: none;
      }
      .search-block {
        padding: 20px;
        background: #f4f4f4;
      }
      .input-group input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px 0 0 4px;
      }
      .input-group button {
        border-radius: 0 4px 4px 0;
      }
    </style>
  </head>
  <body>
    <main id="main">
      <!-- Här kan ditt innehåll ligga -->
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-lg-auto ml-auto">
            <div class="social-profiles">
              <ul>
                <li>
                  <a
                    href="https://www.facebook.com/nisse.lindberg/"
                    target="_blank"
                    >F</a
                  >
                </li>
                <li>
                  <a
                    href="http://www.linkedin.com/in/nisselindberg"
                    target="_blank"
                    >L</a
                  >
                </li>
                <li>
                  <a href="https://www.instagram.com/angorakatt" target="_blank"
                    >I</a
                  >
                </li>
              </ul>
            </div>
          </div>
          <div class="col-lg text-lg-left mt-3 mt-lg-0">
            <div>
              &copy; 2025
              <a href="https://www.nisselindberg.com/">nisselindberg.com</a>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <div class="back-to-top">
      <a href="#main" title="Gå till toppen">&#8679;</a>
    </div>

    <div class="search-block">
      <form action="#" method="get">
        <div class="input-group">
          <input type="search" name="s" placeholder="Sök" />
          <div class="input-group-append">
            <button class="btn btn-info" type="submit">Sök</button>
          </div>
        </div>
      </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Smooth scroll till toppen
      document
        .querySelector(".back-to-top a")
        .addEventListener("click", function (e) {
          e.preventDefault();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
    </script>
  </body>
</html>
