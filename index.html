<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nisse Lindberg | UX Designer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Light Theme Colors (from your main portfolio) */
        --color-bg-light: #ffffff;
        --color-card-bg-light: #f7f7f7;
        --color-text-main-light: #333;
        --color-text-heading-light: #000;
        --color-text-subtle-light: #666;
        --color-btn-bg-light: #000;
        --color-btn-text-light: #fff;
        --color-btn-border-light: #e0e0e0;

        /* Dark Theme Colors (from your main portfolio) */
        --color-bg-dark: #020617;
        --color-card-bg-dark: #1e293b;
        --color-text-main-dark: #cccccc;
        --color-text-heading-dark: #ffffff;
        --color-accent-dark: #3b82f6;
        --color-accent-dark-hover: #2563eb;
        --color-btn-border-dark: #374151;

        /* Semantic Variables (Default Light) */
        --bg-color: var(--color-bg-light);
        --card-bg: var(--color-card-bg-light);
        --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        --text-main: var(--color-text-main-light);
        --text-heading: var(--color-text-heading-light);
        --text-subtle: var(--color-text-subtle-light);
        --text-message: #444;
        --btn-bg: var(--color-btn-bg-light);
        --btn-text: var(--color-btn-text-light);
        --btn-outline-color: var(--color-text-heading-light);
        --btn-outline-border: var(--color-btn-border-light);
        --btn-outline-hover-bg: #f9f9f9;
        --btn-outline-hover-border: var(--color-text-heading-light);
        --profile-border: var(--color-btn-border-light);
        --profile-hover-border: var(--color-btn-border-light);
        --toggle-border: var(--color-btn-border-light);
        --toggle-color: var(--color-text-heading-light);
        --toggle-hover-bg: rgba(0, 0, 0, 0.05);
      }

      /* Dark Theme Overrides */
      :root[data-theme="dark"] {
        --bg-color: var(--color-bg-dark);
        --card-bg: var(--color-card-bg-dark);
        --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        --text-main: var(--color-text-main-dark);
        --text-heading: var(--color-text-heading-dark);
        --text-subtle: var(--color-text-main-dark);
        --text-message: var(--color-text-main-dark);
        --btn-bg: var(--color-accent-dark);
        --btn-text: var(--color-text-heading-dark);
        --btn-outline-color: var(--color-text-heading-dark);
        --btn-outline-border: var(--color-btn-border-dark);
        --btn-outline-hover-bg: rgba(255, 255, 255, 0.1);
        --btn-outline-hover-border: var(--color-accent-dark);
        --profile-border: var(--color-btn-border-dark);
        --profile-hover-border: var(--color-accent-dark);
        --toggle-border: var(--color-btn-border-dark);
        --toggle-color: var(--color-text-heading-dark);
        --toggle-hover-bg: rgba(255, 255, 255, 0.1);
      }

      body {
        font-family: "Bricolage Grotesque", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        transition:
          background-color 0.3s,
          color 0.3s;
      }
      .profile-img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid var(--profile-border);
        margin-bottom: 24px;
        transition:
          transform 0.3s,
          border-color 0.3s;
      }
      .profile-img:hover {
        transform: scale(1.05);
        border-color: var(--profile-hover-border);
      }
      .card {
        background: var(--card-bg);
        padding: 40px;
        border-radius: 16px;
        box-shadow: var(--card-shadow);
        max-width: 400px;
        width: 100%;
        text-align: center;
        transition: background-color 0.3s;
      }
      h1 {
        margin-top: 0;
        margin-bottom: 8px;
        font-size: 28px;
        color: var(--text-heading);
        font-weight: 700;
        transition: color 0.3s;
      }
      .role {
        font-size: 16px;
        color: var(--text-subtle);
        margin-top: 0;
        margin-bottom: 32px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: color 0.3s;
      }
      p.message {
        color: var(--text-message);
        margin-bottom: 40px;
        line-height: 1.6;
        text-align: left;
        transition: color 0.3s;
      }
      .contact-links {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .btn {
        display: block;
        padding: 14px 20px;
        background-color: var(--btn-bg);
        color: var(--btn-text);
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition:
          transform 0.2s,
          background-color 0.2s;
      }
      .btn:hover {
        background-color: var(--color-accent-dark-hover);
        transform: translateY(-2px);
      }
      .btn-outline {
        background-color: transparent;
        color: var(--btn-outline-color);
        border: 2px solid var(--btn-outline-border);
        transition:
          background-color 0.2s,
          color 0.2s,
          border-color 0.2s;
      }
      .btn-outline:hover {
        background-color: var(--btn-outline-hover-bg);
        border-color: var(--btn-outline-hover-border);
      }

      .lang-toggle {
        position: absolute;
        top: 20px;
        right: 20px;
        background: transparent;
        border: 2px solid var(--toggle-border);
        color: var(--toggle-color);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-family: inherit;
        transition: all 0.2s;
      }
      .lang-toggle:hover {
        transform: translateY(-2px);
        background-color: var(--toggle-hover-bg);
      }

      .theme-toggle {
        position: absolute;
        top: 20px;
        right: 74px; /* 20px + 44px + 10px gap */
        background: transparent;
        border: 2px solid var(--toggle-border);
        color: var(--toggle-color);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        transition: all 0.2s;
      }
      .theme-toggle:hover {
        transform: translateY(-2px);
        background-color: var(--toggle-hover-bg);
      }
    </style>
  </head>
  <body>
    <button class="theme-toggle" aria-label="Byt tema">
      <span class="theme-icon">🌙</span>
    </button>
    <button class="lang-toggle" aria-label="Byt språk">
      <span class="lang-text">SV</span>
    </button>
    <div class="card">
      <img
        src="img/cropped-Nisse1.jpg"
        alt="Porträtt av Nisse Lindberg"
        class="profile-img"
      />
      <h1>Nisse Lindberg</h1>
      <p class="role" data-i18n="role">UX Designer</p>

      <p class="message" data-i18n="message">
        Min fullständiga portfolio håller på att uppdateras. <br />
        Kika gärna på den arkiverade versionen eller kontakta mig direkt.
      </p>

      <div class="contact-links">
        <a
          href="https://nisse.framer.ai/"
          class="btn"
          data-i18n="btn_portfolio"
          target="_blank"
          rel="noopener noreferrer"
          >Se min portfolio</a
        >
        <a
          href="https://www.linkedin.com/in/nisselindberg/"
          class="btn btn-outline"
          data-i18n="btn_linkedin"
          target="_blank"
          rel="noopener noreferrer"
          >LinkedIn</a
        >
        <a
          href="mailto:info@nisselindberg.com"
          class="btn btn-outline"
          data-i18n="btn_email"
          >Mejla mig</a
        >
        <a href="tel:+46738700666" class="btn btn-outline" data-i18n="btn_phone"
          >Ring: 073-870 06 66</a
        >
      </div>
    </div>
    <script>
      const translations = {
        sv: {
          role: "UX Designer",
          message:
            "Min fullständiga portfolio håller på att uppdateras. <br /> Kika gärna på den arkiverade versionen eller kontakta mig direkt.",
          btn_portfolio: "Se min portfolio",
          btn_linkedin: "LinkedIn",
          btn_email: "Mejla mig",
          btn_phone: "Ring: 073-870 06 66",
        },
        en: {
          role: "UX Designer",
          message:
            "My full portfolio is currently being updated. <br /> Feel free to check the archived version or contact me directly.",
          btn_portfolio: "View my portfolio",
          btn_linkedin: "LinkedIn",
          btn_email: "Email me",
          btn_phone: "Call: +46 738 700 666",
        },
      };

      const langBtn = document.querySelector(".lang-toggle");
      const langText = document.querySelector(".lang-text");
      let currentLang = "sv";

      langBtn.addEventListener("click", () => {
        currentLang = currentLang === "sv" ? "en" : "sv";
        langText.textContent = currentLang.toUpperCase();
        document.documentElement.lang = currentLang;

        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (translations[currentLang][key]) {
            el.innerHTML = translations[currentLang][key];
          }
        });
      });

      /* Theme Toggle Logic */
      const themeBtn = document.querySelector(".theme-toggle");
      const themeIcon = document.querySelector(".theme-icon");

      function setTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);
        themeIcon.textContent = theme === "dark" ? "☀️" : "🌙";
      }

      // Init theme
      const savedTheme = localStorage.getItem("theme");
      const systemDark = window.matchMedia(
        "(prefers-color-scheme: dark)",
      ).matches;

      if (savedTheme) {
        setTheme(savedTheme);
      } else {
        setTheme(systemDark ? "dark" : "light");
      }

      themeBtn.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme");
        setTheme(current === "dark" ? "light" : "dark");
      });
    </script>
  </body>
</html>
